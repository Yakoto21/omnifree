name: Publicar instalador

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run icon
      - run: npx electron-builder --win --publish never
      - name: Criar Release e enviar atualização
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*Setup*.exe
            dist/*Setup*.exe.blockmap
            dist/latest.yml
