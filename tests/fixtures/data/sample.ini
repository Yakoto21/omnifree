; Arquivo de teste de configuração INI para Lodino
# Suporta comentários com ponto-e-vírgula e cerquilha

app_title = Lodino Native Core
timeout_seconds = 30

[Database]
host = 127.0.0.1
port = 5432
name = lodino_db ; comentário inline após espaço
ssl_enabled = true

[Security]
max_buffer_mb = 100
allow_path_traversal = false
admin_user = "admin with spaces"

[UI]
theme = dark
language = pt-BR
show_sidebar = true
